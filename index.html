<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Client Website Previews</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--ink:#0d1b2e;--muted:#4f5f78;--line:#dfe7f1;--green:#1e9e57;--blue:#1463d8;--yellow:#ffc72c}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}
.bar{height:6px;background:linear-gradient(90deg,var(--green),var(--blue) 55%,var(--yellow))}
main{max-width:960px;margin:0 auto;padding:56px 16px}
h1{font:700 clamp(34px,6vw,56px)/1.05 Rajdhani,sans-serif;text-transform:uppercase;margin:0 0 8px}
p.sub{color:var(--muted);margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
a.card{display:block;border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--ink);text-decoration:none;box-shadow:0 12px 32px -14px rgba(13,27,46,.2);transition:.25s}
a.card:hover{transform:translateY(-4px);border-color:var(--green)}
a.card b{display:block;font:700 24px Rajdhani,sans-serif;text-transform:uppercase}
a.card span{color:var(--muted);font-size:14px}
a.card em{display:inline-block;margin-top:12px;font-style:normal;font-weight:600;color:var(--blue)}
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <h1>Client Website Previews</h1>
  <p class="sub">Redesign concepts prepared for client review.</p>
  <div class="grid">
    <a class="card" href="globalereps/">
      <b>Globale Reps</b>
      <span>Homepage redesign &middot; 3D industrial style</span><br />
      <em>View preview &rarr;</em>
    </a>
  </div>
</main>
</body>
</html>
